name: Deploy Django app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to VPS
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -p 22 root@${{ vars.MY_IP }} 'bash -s' <<'EOF'
            set -e

            REPO_DIR="/opt/Github_action_owren"
            REPO_URL="https://github.com/Programmerrr071/Github_action_owren.git"

            echo "Installing system packages..."

            apt-get update
            apt-get install -y python3 python3-venv python3-pip git

            echo "Preparing project..."

            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone "$REPO_URL" "$REPO_DIR"
            else
              cd "$REPO_DIR"
              git pull origin main
            fi

            cd "$REPO_DIR"

            echo "Creating virtual environment..."

            if [ ! -f "venv/bin/activate" ]; then
              rm -rf venv
              python3 -m venv venv
            fi

            echo "Activating virtual environment..."

            source venv/bin/activate

            echo "Installing requirements..."

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "Running migrations..."

            python manage.py migrate --noinput

            echo "Collecting static files..."

            python manage.py collectstatic --noinput

            echo "Restarting Django..."

            pkill -f "[m]anage.py runserver" || true

            nohup "$REPO_DIR/venv/bin/python" manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 < /dev/null &

            sleep 3

            if pgrep -f "[m]anage.py runserver" >/dev/null; then
              echo "Django started successfully on port 8000"
            else
              echo "Django failed to start!"
              cat /tmp/django.log
              exit 1
            fi

            echo "Deployment completed successfully!"
          EOF
