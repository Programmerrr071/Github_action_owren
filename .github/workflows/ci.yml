name: My Django Project CI
on: push

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Connect to VPS
        run: |
          export SSHPASS="gQa4usuhWz4w"

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@153.75.83.209 \
            "whoami && hostname && uptime"