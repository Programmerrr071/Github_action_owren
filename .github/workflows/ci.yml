name: My Django_project CI
on: push

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Connect to VPS
        run: |
          export SSHPASS=${{ secrets.pass}}

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@${{ vars.my_ip }} \
            "if command -v python3 &>/dev/null; then
                echo "[+] Python eýýäm bar: $(python3 --version)"
            else
                echo "[-] Python tapylmady. Gurnalyar..."
                sudo apt update && sudo apt install -y python3 python3-pip"