name: My Django_project CI
on: push

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
      
      - name: Connect to VPS
        run: |
          export SSHPASS=${{ secrets.pass}}

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@${{ vars.my_ip }} \
            "whoami && hostname && uptime"